name: Hotel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Build frontend image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/upgiri407/myhotel \
            -t ghcr.io/upgiri407/hotel-frontend:latest \
            -t ghcr.io/upgiri407/hotel-frontend:${{ github.sha }} .

      - name: Build backend image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/upgiri407/myhotel \
            -t ghcr.io/upgiri407/hotel-backend:latest \
            -t ghcr.io/upgiri407/hotel-backend:${{ github.sha }} ./backend

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Upload images to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/upgiri407/hotel-frontend:latest
          docker push ghcr.io/upgiri407/hotel-frontend:${{ github.sha }}
          docker push ghcr.io/upgiri407/hotel-backend:latest
          docker push ghcr.io/upgiri407/hotel-backend:${{ github.sha }}