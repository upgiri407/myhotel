name: Hotel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Build frontend image
        run: docker build -t hotel-frontend:ci .

      - name: Build backend image
        run: docker build -t hotel-backend:ci ./backend