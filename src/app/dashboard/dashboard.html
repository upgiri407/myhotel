    <div class="p-6 bg-slate-100 min-h-screen">
      <div class="mb-6">
        <label>Select Date:</label>

        <input
          type="date"
          (change)="onDateChange($event)"
        />
<app-users [selectedDate]="selectedDate"></app-users>
<p>Selected Date: {{ selectedDate }}</p>
        <h1 class="text-3xl font-bold text-slate-800">Switpotato Business Dashboard</h1>
        <p class="text-slate-600 mt-1">Overview of products, sales, and inventory</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div *ngFor="let card of cards" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
          <div class="text-sm text-slate-500">{{ card.title }}</div>
          <div class="mt-3 text-3xl font-bold text-slate-800">{{ card.value }}</div>
          <div class="mt-2 text-xs font-medium" [ngClass]="card.trend.startsWith('+') ? 'text-green-600' : 'text-red-600'">
            {{ card.trend }} from last month
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200">
          <h2 class="text-xl font-semibold text-slate-800">Products</h2>
          <!-- <button (click)="resetForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
            + Add Product
          </button> -->
        </div>

        <div class="p-5 border-b border-slate-200 bg-slate-50">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <input [(ngModel)]="form.name" placeholder="Product name" class="border border-slate-300 rounded-lg px-3 py-2" />
            <input [(ngModel)]="form.category" placeholder="Category" class="border border-slate-300 rounded-lg px-3 py-2" />
            <input [(ngModel)]="form.quantity" type="number" placeholder="Quantity" class="border border-slate-300 rounded-lg px-3 py-2" />
            <input [(ngModel)]="form.amount" type="number" placeholder="Amount" class="border border-slate-300 rounded-lg px-3 py-2" />
            <select [(ngModel)]="form.status" class="border border-slate-300 rounded-lg px-3 py-2">
              <option value="Active">Active</option>
              <option value="Low Stock">Low Stock</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <div class="mt-4 flex justify-end">
            <button (click)="saveProduct()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
              {{ isEditing ? 'Update Product' : 'Save Product' }}
            </button>
          </div>
        </div>
