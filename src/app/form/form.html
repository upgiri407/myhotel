<form [formGroup]="myform" (ngSubmit)="onSubmit()" class="max-w-md mx-auto mt-10 p-6 border rounded-lg shadow">

  <div class="mb-4">
    <label class="block mb-1 font-medium">User Name</label>
    <input type="text" formControlName="name" class="w-full border rounded px-3 py-2">
  </div>

  <div class="mb-4">
    <label class="block mb-1 font-medium">Email</label>
    <input type="email" formControlName="email" class="w-full border rounded px-3 py-2">

    <div *ngIf="
    myform.controls.email.touched &&
    myform.controls.email.errors?.['required']
  " class="text-sm mt-1">
      Email is required
    </div>

  </div>

  <div class="mb-4">
    <label class="block mb-1 font-medium">Password</label>
    <input type="password" formControlName="password" class="w-full border rounded px-3 py-2">

    <div *ngIf="
    myform.controls.password.touched &&
    myform.controls.password.errors?.['required']
  " class="text-sm mt-1">
      Password is required
    </div>
   
  </div>

  <button type="submit" class="w-full border rounded px-4 py-2 font-medium">
    Submit
  </button>

</form>
